[package]
name = "alloy-ui"
description = "Alloy: native Rust desktop UI framework (facade crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Not `workspace = true`: `tests/audit_apps.rs` `include!`s example files, which cannot carry
# crate-level docs. The library itself still warns via `#![warn(missing_docs)]` in lib.rs.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "allow"

[features]
# The default build draws with wgpu and falls back to the CPU rasteriser when no adapter works.
# `default-features = false, features = ["soft-window"]` is the slim build: no wgpu, no naga,
# roughly 40% smaller. `gles` adds the OpenGL backend for machines with no Vulkan.
default = ["gpu", "soft-window"]
gpu = ["alloy-ui-render/gpu"]
soft-window = ["alloy-ui-render/soft-window"]
gles = ["alloy-ui-render/gles"]
# The whole Lucide pack (about 1.0 MB of font) and the whole Phosphor Regular pack (about 0.5 MB),
# for `icon_named("heart")`. Off by default, so binaries stay small; `ALLOY_ICONS_SUBSET` shakes
# them down to the icons you name (tools/icons/shake.py).
icons-lucide-full = ["alloy-ui-render/icons-lucide-full", "alloy-ui-widgets/icons-lucide-full"]
icons-phosphor-full = ["alloy-ui-render/icons-phosphor-full", "alloy-ui-widgets/icons-phosphor-full"]
icons-full = ["icons-lucide-full", "icons-phosphor-full"]

[dependencies]
alloy-ui-core.workspace = true
alloy-ui-layout.workspace = true
alloy-ui-render.workspace = true
alloy-ui-theme.workspace = true
alloy-ui-widgets.workspace = true
alloy-ui-platform.workspace = true
alloy-ui-ipc.workspace = true
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-ui-macros = { path = "../macros", version = "0.0.1" }

[dev-dependencies]
trybuild = "1"
# Only so the guide chapter on updates and crash reports compiles as a doc-test.
alloy-ui-ship.workspace = true
