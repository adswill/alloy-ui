[package]
name = "alloy-ui-bench"
description = "Benchmark harness for Alloy UI: frame cost, startup, binary size"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
alloy-ui = { path = "../alloy" }
alloy-ui-examples = { path = "../../examples" }
alloy-ui-core.workspace = true
alloy-ui-render = { workspace = true, features = ["gpu", "soft-window"] }

[[bin]]
name = "alloy-bench"
path = "src/main.rs"

[[bin]]
name = "phases"
path = "src/bin/phases.rs"

[[bin]]
name = "text"
path = "src/bin/text.rs"

[[bin]]
name = "large"
path = "src/bin/large.rs"

[[bin]]
name = "startup"
path = "src/bin/startup.rs"
