[package]
name = "alloy-ui-platform"
description = "Alloy platform shell traits (window, menu, tray, dialogs, clipboard)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
alloy-ui-core.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
raw-window-handle = "0.6"
log = "0.4"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(windows)'.dependencies]
# The `#[implement]` macro expands to paths in this crate, so it must be a direct dependency.
windows-core = "0.58"
windows = { version = "0.58", default-features = false, features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAppleEventManager", "NSAppleEventDescriptor", "NSString", "NSData", "NSObject", "NSGeometry", "NSThread", "NSURL", "NSArray", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSPasteboard", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSAlert", "NSAppearance", "NSButton", "NSControl", "NSImage", "NSEvent", "NSView", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSVisualEffectView", "NSColor", "NSGraphics"] }


# Android: `NativeActivity` needs no Java code of our own (the system provides the
# activity class), which keeps the bundle scaffold to a manifest and a .so.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "android-native-activity"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSObject", "NSGeometry"] }
objc2-ui-kit = { version = "0.3", features = ["UIView", "UIResponder", "UIPasteboard", "UIGeometry"] }

# Both open real windows or use real OS services, so they need the main thread: own `main`.
[[test]]
name = "desktop_smoke"
harness = false

[[test]]
name = "system_runtime"
harness = false
