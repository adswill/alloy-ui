[package]
name = "alloy-ui-cli"
description = "Alloy build and bundle tool: .app/.dmg, .deb/AppImage/Flatpak, .exe/NSIS/MSI/MSIX installer, release signing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "alloy_ui_cli"
path = "src/lib.rs"

[[bin]]
name = "alloy"
path = "src/main.rs"

# `cargo alloy <command>` is the same tool, so `cargo alloy test` works once installed.
[[bin]]
name = "cargo-alloy"
path = "src/main.rs"

[dependencies]
alloy-ui-ipc.workspace = true
alloy-ui-ship = { path = "../ship", version = "0.0.1", default-features = false }
flate2 = "1.1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4"
thiserror = "2.0.21"
toml = "1.0.7"
