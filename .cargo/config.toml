# With panic = "abort" (the release profile) nothing unwinds, so our own code does not need
# unwind tables: they were 0.37 MB of the counter binary. rustc keeps them wherever
# panic = "unwind" still needs them (tests). Not on Windows: x86_64 Windows requires unwind
# tables (structured exception handling) and rustc rejects the flag there.
[target.'cfg(not(windows))']
rustflags = ["-C", "force-unwind-tables=no"]
