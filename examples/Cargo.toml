[package]
name = "alloy-ui-examples"
description = "Example applications for the Alloy UI framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true


[package.metadata.alloy]
identifier = "dev.alloyui.examples"
product-name = "Alloy Counter"
publisher = "Alloy"
category = "Utility"
icons = ["assets/icon-32.png", "assets/icon-256.png", "assets/icon-512.png"]

[features]
default = ["gpu", "soft-window"]
gpu = ["alloy-ui/gpu"]
soft-window = ["alloy-ui/soft-window"]
gles = ["alloy-ui/gles"]

[dependencies]
alloy-ui = { path = "../crates/alloy", default-features = false }

[[bin]]
name = "counter"
path = "src/bin/counter.rs"
[[bin]]
name = "todo"
path = "src/bin/todo.rs"
[[bin]]
name = "text_editor"
path = "src/bin/text_editor.rs"
[[bin]]
name = "settings"
path = "src/bin/settings.rs"
[[bin]]
name = "gallery"
path = "src/bin/gallery.rs"
[[bin]]
name = "desk"
path = "src/bin/desk.rs"
[[bin]]
name = "dashboard"
path = "src/bin/dashboard.rs"

[dev-dependencies]
alloy-ui-render.workspace = true
