name: CI
on:
  push:
    branches: [main, claude/project-thread-6n01vk]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Runner start-up can lag by many minutes; never cancel runs of the integration branch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/project-thread-6n01vk' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libvulkan1
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
