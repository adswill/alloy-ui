# Roadmap 6-10 (shipping), proven on real runners: signed installers that really
# install, packages that really build, an updater that really replaces the
# running program, and crash reports that really land on disk.
# Real Apple notarisation needs secrets; that job is skipped without them.
name: ship
on:
  push:
    branches: [main]
    paths: ["crates/ship/**", "crates/cli/**", "ci/**", ".github/workflows/ship.yml"]
  pull_request:
    paths: ["crates/ship/**", "crates/cli/**", "ci/**", ".github/workflows/ship.yml"]
  workflow_dispatch:
concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  update-e2e:
    # Items 9 and 10: unit and HTTP tests, then the real-process update script.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p alloy-ui-ship -- --nocapture
      - name: Update and crash report, end to end
        shell: bash
        run: ci/e2e-update.sh

  linux-packages:
    # Item 8: AppImage and Flatpak. Ubuntu 22.04 so the binary runs on the
    # Flatpak runtime's glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libx11-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libvulkan1 libfuse2 file
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "ALLOY_APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
      - run: cargo build --release -p alloy-ui-cli
      - run: crates/cli/ci/verify-linux-pkgs.sh "$PWD/target/release/alloy"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-flatpak
          path: bundle-out/*.AppImage
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-flatpak
          path: bundle-out/*.flatpak
          retention-days: 7

  windows-installers:
    # Item 7: MSI (WiX) and MSIX installed and removed for real.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX and NSIS
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          "ALLOY_REQUIRE_MSI=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ALLOY_REQUIRE_NSIS=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: cargo build --release -p alloy-ui-cli
      - name: MSIX, self-signed, installed with Add-AppxPackage
        shell: pwsh
        run: ./crates/cli/ci/verify-msix.ps1 "$PWD\target\release\alloy.exe"
      - name: MSI and NSIS, silent install and uninstall
        shell: pwsh
        run: ./crates/cli/ci/verify-windows.ps1 "$PWD\target\release\alloy.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installers
          path: |
            bundle-out/*.msi
            bundle-out/*.msix
            bundle-out/*-setup.exe
          if-no-files-found: ignore
          retention-days: 7

  macos-bundle:
    # Item 6, the part that needs no secrets: ad hoc signature verifies, the
    # dmg mounts, the app runs from it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p alloy-ui-cli
      - run: crates/cli/ci/verify-macos.sh "$PWD/target/release/alloy"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-adhoc-bundles
          path: bundle-out/*.dmg
          retention-days: 7

  macos-notarize:
    # Item 6, the real thing. Skipped unless the secrets exist (forks, PRs from
    # forks and this repo until Apple credentials are added).
    if: github.event_name != 'pull_request' && vars.NOTARIZE == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p alloy-ui-cli
      - run: crates/cli/ci/notarize-macos.sh "$PWD/target/release/alloy"
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-notarized
          path: notarized-out/*.dmg
