name: Verify
# Real-OS verification: goldens, windowed smoke runs with screenshots, GPU path, Wayland and
# accessibility trees. Screenshots are uploaded as artifacts (one per OS) so people can look at them.
on:
  push:
    branches: [main, claude/project-thread-6n01vk]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/project-thread-6n01vk' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  goldens:
    # Render every example headless, upload the PNGs, and compare all golden tests on this OS.
    name: goldens (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Golden tests (render, widgets, examples)
        id: golden
        continue-on-error: true
        shell: bash
        run: cargo test --release -p alloy-ui-render -p alloy-ui-widgets -p alloy-ui-examples -- golden 2>&1 | tee golden.log
      - name: Headless example screenshots
        shell: bash
        run: |
          mkdir -p shots
          cargo build --release -p alloy-ui-examples --bins
          for ex in counter todo text_editor settings gallery dashboard; do
            ./target/release/$ex --headless shots/$ex.png || echo "FAILED: $ex"
          done
          ls -l shots
      - name: Collect golden mismatches
        if: always()
        shell: bash
        run: |
          d="${TMPDIR:-${RUNNER_TEMP:-/tmp}}/alloy-golden"
          [ -d "$d" ] && cp -r "$d" shots/golden-mismatches || true
          [ -d "$RUNNER_TEMP/alloy-golden" ] && cp -r "$RUNNER_TEMP/alloy-golden" shots/golden-mismatches || true
          [ -d /tmp/alloy-golden ] && cp -r /tmp/alloy-golden shots/golden-mismatches || true
          cp golden.log shots/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldens-${{ runner.os }}
          path: shots
      - name: Fail if goldens failed
        if: steps.golden.outcome == 'failure'
        shell: bash
        run: echo "golden tests failed on ${{ runner.os }}; see artifact goldens-${{ runner.os }}"; exit 1

  gpu:
    # The real GPU path (wgpu), on whatever adapter the runner offers.
    name: gpu (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev mesa-vulkan-drivers libvulkan1
      - name: GPU render tests
        shell: bash
        run: |
          mkdir -p gpu
          cargo test --release -p alloy-ui-render --test render -- gpu --nocapture --test-threads=1 2>&1 | tee gpu/gpu.log
          grep -E "GPU adapter|SKIP" gpu/gpu.log | sort -u | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail if the GPU tests were skipped
        shell: bash
        run: |
          if grep -q "SKIP: no graphics adapter" gpu/gpu.log; then echo "no adapter on ${{ runner.os }}"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-${{ runner.os }}
          path: gpu

  windowed:
    # Open the real window, screenshot the desktop, and read the accessibility tree.
    name: windowed + a11y (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p alloy-ui-examples --bin counter
      - name: macOS run, screenshot, AX tree
        if: runner.os == 'macOS'
        run: |
          mkdir -p win
          ./target/release/counter > win/counter.log 2>&1 &
          pid=$!
          sleep 10
          kill -0 $pid || { echo "counter exited early"; cat win/counter.log; exit 1; }
          screencapture -x win/desktop.png || true
          swift .github/scripts/ax_dump.swift $pid 2>&1 | tee win/ax.txt || echo "AX check failed (see win/ax.txt)" | tee -a win/ax.txt
          kill $pid || true
      - name: Windows run, screenshot, UIA tree
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force win | Out-Null
          $p = Start-Process -FilePath .\target\release\counter.exe -PassThru -RedirectStandardError win\counter.log
          Start-Sleep 10
          if ($p.HasExited) { Get-Content win\counter.log; throw "counter exited early: $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\win\desktop.png")
          try { & .\.github\scripts\uia_dump.ps1 -ProcessId $p.Id -Out win\uia.txt } finally { Stop-Process -Id $p.Id -Force }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windowed-${{ runner.os }}
          path: win

  wayland:
    # A real Wayland compositor (sway, headless) with the window opened through the Wayland backend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libvulkan1 sway grim wl-clipboard
      - run: cargo build --release -p alloy-ui-examples --bin counter
      - name: Run under sway
        run: |
          mkdir -p wl
          export XDG_RUNTIME_DIR=$(mktemp -d); chmod 700 $XDG_RUNTIME_DIR
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
          sway -c /dev/null > wl/sway.log 2>&1 &
          for i in $(seq 20); do ls $XDG_RUNTIME_DIR/wayland-* >/dev/null 2>&1 && break; sleep 1; done
          export WAYLAND_DISPLAY=$(basename $(ls $XDG_RUNTIME_DIR/wayland-[0-9] | head -1))
          export SWAYSOCK=$(ls $XDG_RUNTIME_DIR/sway-ipc.*.sock | head -1)
          unset DISPLAY
          WINIT_UNIX_BACKEND=wayland ./target/release/counter > wl/counter.log 2>&1 &
          pid=$!
          # Wait for the window to map (software Vulkan start-up is slow).
          for i in $(seq 40); do
            kill -0 $pid 2>/dev/null || { echo "counter exited early"; cat wl/counter.log; exit 1; }
            swaymsg -t get_tree > wl/tree.json
            grep -qE '"shell": ?"xdg_shell"' wl/tree.json && break
            sleep 1
          done
          sleep 2
          grim wl/counter_wayland.png || true
          echo "--- counter.log"; tail -30 wl/counter.log
          echo "--- sway.log"; tail -20 wl/sway.log
          python3 -c "import json; print(json.dumps(json.load(open('wl/tree.json')), indent=1))" | grep -E '"(shell|app_id|name|type|pid)"' | head -40
          # The window must be a native Wayland surface (xdg_shell), not XWayland.
          grep -qE '"shell": ?"xdg_shell"' wl/tree.json || { echo "no native Wayland window"; exit 1; }
          kill $pid || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-Linux
          path: wl

  atspi:
    # Linux accessibility: Alloy's AT-SPI server against the reference client library (libatspi).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev dbus at-spi2-core python3-gi gir1.2-atspi-2.0
      - run: bash crates/platform/tests/atspi_e2e.sh
