# Owned by the `alloy-ui-cli` workstream. Builds a real app crate and bundles
# it on each OS, then checks the artifacts (dpkg-deb, codesign, AppImage run,
# NSIS compile). The general fmt/clippy/test matrix lives in ci.yml.
name: alloy-cli
# Runner policy (DECISIONS 47): pull requests run Ubuntu only; pushes to the
# integration branch and manual runs use the full macOS/Ubuntu/Windows matrix.
on:
  push:
    branches: [main, claude/project-thread-6n01vk, claude/project-thread-jiaih7]
    paths: ["crates/cli/**", "examples/**", ".github/workflows/alloy-cli.yml"]
  pull_request:
    paths: ["crates/cli/**", "examples/**", ".github/workflows/alloy-cli.yml"]
  workflow_dispatch:
concurrency:
  group: alloy-cli-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/project-thread-6n01vk' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "ALLOY_APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
          echo "ALLOY_REQUIRE_APPIMAGE=1" >> "$GITHUB_ENV"
      - name: Install rpm, cpio and NSIS (verification tools)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm cpio nsis
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "ALLOY_REQUIRE_MSI=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          "ALLOY_REQUIRE_NSIS=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Unit and end-to-end tests
        run: cargo test -p alloy-ui-cli -- --nocapture
      - name: Show wix build options
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: wix build -? | Select-Object -First 80

      # Real artifacts: bundle the counter example and verify what comes out.
      - name: Build alloy
        run: cargo build --release -p alloy-ui-cli
      - name: Linux system deps for the counter
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libvulkan1
      - name: Bundle and verify counter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./crates/cli/ci/verify-windows.ps1 "$PWD\target\release\alloy.exe"
      - name: Bundle and verify counter (macOS)
        if: runner.os == 'macOS'
        run: crates/cli/ci/verify-macos.sh "$PWD/target/release/alloy"
      - name: Bundle and verify counter (Linux)
        if: runner.os == 'Linux'
        run: crates/cli/ci/verify-linux.sh "$PWD/target/release/alloy"
      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-bundles-${{ runner.os }}
          path: bundle-out/
          if-no-files-found: ignore
          retention-days: 7

  template:
    # `alloy new` output must keep compiling against the workspace crates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Generate and check a new app
        run: |
          cargo build -p alloy-ui-cli
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/target/debug/alloy" new tmpl-app --alloy-path "$GITHUB_WORKSPACE"
          cd tmpl-app
          CARGO_TARGET_DIR="$RUNNER_TEMP/tmpl-target" cargo check
          CARGO_TARGET_DIR="$RUNNER_TEMP/tmpl-target" "$GITHUB_WORKSPACE/target/debug/alloy" check
