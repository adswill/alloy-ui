<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-head">
    <h1>Pulse</h1>
    <div class="head-actions">
      <div class="segmented" id="range" role="group" aria-label="Range">
        <button data-range="7" aria-pressed="true">7 days</button>
        <button data-range="30" aria-pressed="false">30 days</button>
        <button data-range="90" aria-pressed="false">90 days</button>
      </div>
      <button id="theme" class="btn">Dark</button>
    </div>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="card">
    <h2>Revenue</h2>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card">
    <h2>Recent orders</h2>
    <table>
      <thead><tr><th>Customer</th><th>Plan</th><th class="num">Amount</th><th>Status</th></tr></thead>
      <tbody id="orders"></tbody>
    </table>
  </section>
  <script src="app.js"></script>
</body>
</html>
